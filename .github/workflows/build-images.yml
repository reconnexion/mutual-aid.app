name: Build and publish Docker images

# Builds the L'Entraide backend and frontend images and pushes them to the
# GitHub Container Registry.
#
#   push on `entraide-rewrite` -> :dev    images, built for dev.lentraide.app
#   push of a `v*` git tag     -> :x.y.z and :latest images, built for lentraide.app
#
# The frontend values are inlined by Vite at build time, which is why the
# target domain has to be known here and not at deployment time.

on:
  push:
    branches: [entraide-rewrite]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Select the target environment
        id: env
        run: |
          # Set the DEV_/PROD_POD_PROVIDER_BASE_URL repository variable to restrict an
          # environment to a single Pod provider. Unset, the login page lists the public
          # providers and lets the user pick one.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "domain=${{ vars.PROD_DOMAIN_NAME || 'lentraide.app' }}" >> "$GITHUB_OUTPUT"
            echo "app_name=L'Entraide" >> "$GITHUB_OUTPUT"
            echo "pod_provider=${{ vars.PROD_POD_PROVIDER_BASE_URL }}" >> "$GITHUB_OUTPUT"
          else
            echo "domain=${{ vars.DEV_DOMAIN_NAME || 'dev.lentraide.app' }}" >> "$GITHUB_OUTPUT"
            echo "app_name=L'Entraide (dev)" >> "$GITHUB_OUTPUT"
            echo "pod_provider=${{ vars.DEV_POD_PROVIDER_BASE_URL }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/lentraide-${{ matrix.component }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref_type != 'tag' }}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/${{ matrix.component }}.dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          # Ignored by the backend image, which takes no build argument
          build-args: |
            VITE_APP_NAME=${{ steps.env.outputs.app_name }}
            VITE_APP_DESCRIPTION=Petites annonces d'entraide entre voisins, partagées en confiance
            VITE_APP_LANG=fr
            VITE_BACKEND_URL=https://${{ steps.env.outputs.domain }}/api/
            VITE_BACKEND_CLIENT_ID=https://${{ steps.env.outputs.domain }}/api/app
            VITE_SHAPE_REPOSITORY_URL=${{ vars.SHAPE_REPOSITORY_URL || 'https://shapes.activitypods.org/' }}
            VITE_ORGANIZATION_NAME=${{ vars.ORGANIZATION_NAME }}
            VITE_ORGANIZATION_URL=${{ vars.ORGANIZATION_URL }}
            VITE_POD_PROVIDER_BASE_URL=${{ steps.env.outputs.pod_provider }}
            VITE_MAPBOX_ACCESS_TOKEN=${{ secrets.MAPBOX_ACCESS_TOKEN }}
            VITE_PORTEJUNES_URL=${{ vars.PORTEJUNES_URL }}
            VITE_DONATION_URL=${{ vars.DONATION_URL }}

  # Once both :dev images are on ghcr.io, ask Coolify to pull them and restart
  # the dev stack (no build happens on the server). Requires the repository
  # variable COOLIFY_URL (e.g. https://coolify.example.org) and the secret
  # COOLIFY_TOKEN (an API token with write permission on the service).
  deploy-dev:
    needs: build
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Restart the dev stack on Coolify with the latest images
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          SERVICE_UUID: ${{ vars.COOLIFY_DEV_SERVICE_UUID || '9wj93umjayuka1gp3lezridg' }}
        run: |
          if [ -z "$COOLIFY_URL" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "COOLIFY_URL / COOLIFY_TOKEN not set, skipping deployment"
            exit 0
          fi
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_URL/api/v1/services/$SERVICE_UUID/restart?latest=true"
